table: Holdout_HCP_Universe
description: "Authoritative analyzable-HCP universe for the gastro holdout analysis — the canonical set of in-scope HCPs (a membership list, one column). Keyed on abbott_customer_id."
grain: one row per HCP (abbott_customer_id)
date_range: n/a (static reference snapshot)
refresh: static reference list (re-issued per analysis cut)
known_issues:
  - "Scope/membership list: HCP analyses on the gastro universe MUST be RESTRICTED to these ids (RULE-102). It is a strict subset of the gastro universe (700 of 1,040 HCPs), so the restriction is material — not a no-op."
  - "Defines the analyzable population; it is NOT a treatment/control split. Presence of an id simply means the HCP is in scope."
  - "abbott_customer_id is the same key value space as the gastro universe's abv_customer_id and HCP_demographics.abbott_customer_id (join-compatible). The holdout now covers 700 of those ids; coverage shrank, the key did not change."
columns:
  - name: abbott_customer_id
    type: integer
    description: "AbbVie HCP identifier; the join key (= Gastro_prod_sales_260605.abv_customer_id and HCP_demographics.abbott_customer_id). Presence = HCP is in the analyzable holdout universe."
