table: Gastro_prod_sales_260605
description: "HCP-level (prescriber) gastro IBD universe extract. One row per HCP x product_brand x indication_code x data_type x version_flag, carrying a 399-week TRx/NBRx history (frx*) plus rolling-window sums and HCP targeting/segmentation attributes. Source: z_abv_cws_mabi_immun_analytics.gastro_hcp_universe; snapshot 2026-06-05."
grain: "one row per HCP (abv_customer_id) per product_brand per indication_code per data_type per version_flag"
date_range: "2018-10-19 to 2026-06-05 (frx series, weekly; frx1 = latest)"
refresh: "periodic re-extract; each refresh is a new dated file (YYMMDD in the name = latest week = frx1)"
known_issues:
  - "SCOPE: IBD-only. indication_code is CD or UC only; all volumes are IBD (Crohn's / Ulcerative Colitis) usage."
  - "product_brand mixes individual brands/biosimilars/presentations with CLASS ROLLUPS {SI_ORAL, TNF, JAK, IL_23, IL_23_IL_12, A4B7, S1P}. The rollups equal the sum of their constituent brands (verified ratio 1.000 for JAK/IL_23/IL_23_IL_12/A4B7/S1P; TNF likewise) and MUST be excluded when summing individual brands to avoid double counting (RULE-101). SI_ORAL is the market grand total."
  - "SKYRIZI (plain) denotes SKYRIZI OBI (on-body injector) in this masterdata; SKYRIZI_IV carries the IV volumes. To get total Skyrizi, combine SKYRIZI + SKYRIZI_IV (RULE-303)."
  - "Brand labels have delimiter/spacing duplicates for the same entity (e.g. 'ENTYVIO SQ' vs 'ENTYVIO_SQ'; 'ADALIMUMAB RYVK' vs 'ADALIMUMAB_RYVK' vs 'ADALIMUMAB-RYVK'). Normalise before grouping (RULE-303)."
  - "frx* is a weekly value series whose meaning depends on data_type (TRx vs NBRx) for that row. frx1 = most recent week (week ending 2026-06-05); each higher index is one earlier week. No explicit date column exists; dates are positional (RULE-006/RULE-401)."
  - "cur_/pre_{4,13,26,52}wk are contiguous trailing-week sums of frx* (cur = most recent N weeks, pre = the N weeks before). Use them directly; do not re-derive unless auditing (RULE-007)."
  - "ai456_cp_flag is constant 'N' (dead column). The numeric meaning of the ai*_cp_flag codes is unconfirmed and set aside per user (2026-06-26)."
  - "PII columns present (name, first/middle/last_name, address, npi_id). Do not emit raw PII in routine aggregate output."
  - "pdrp_flag = Y marks PDRP opt-out HCPs; per user no suppression rule is applied (documented only)."
  - "Values are projected/adjusted volumes carried to several decimals; they are not whole script counts."
  - "A small number of rows have null specialty_description / pdrp_flag."
columns:
  - name: abv_customer_id
    type: float
    description: "AbbVie internal customer/HCP identifier and the PRIMARY HCP key for this table; this is the join key used to assemble HCP-level multi-brand views (= 'abbott_customer_id' in the source SQL). Unique within any (product_brand, indication_code, data_type) slice."
  - name: npi_id
    type: float
    description: "National Provider Identifier (10-digit) for the HCP; may be blank for rows without an NPI."
  - name: ims_id
    type: float
    description: "IQVIA (IMS) provider identifier for the HCP."
  - name: name
    type: string
    description: "HCP full name. PII — do not emit in routine aggregate output."
  - name: first_name
    type: string
    description: "HCP first name. PII."
  - name: middle_name
    type: string
    description: "HCP middle name/initial. PII."
  - name: last_name
    type: string
    description: "HCP last name. PII."
  - name: address
    type: string
    description: "HCP practice street address. PII."
  - name: city
    type: string
    description: "HCP practice city."
  - name: state
    type: string
    description: "HCP practice state (USPS 2-letter)."
    sample_values: [NY, OH, FL, PA, CA]
  - name: zip_code
    type: float
    description: "HCP practice ZIP code (numeric; leading zeros lost)."
  - name: phy_univ_flag
    type: string
    description: "Y if the HCP is in the physician universe (the in-scope target population); N otherwise."
    sample_values: [Y, N]
  - name: true_1view_flag
    type: string
    description: "Y if the HCP is part of the consolidated 'True 1View' customer view (mirrors phy_univ_flag in this extract)."
    sample_values: [Y, N]
  - name: ai4_cp_flag
    type: string
    description: "Call-plan inclusion flag (cp = call plan). Exact meaning of the numeric code UNCONFIRMED — set aside per user 2026-06-26; do not build rules on it yet."
    sample_values: [Y, N]
  - name: ai5_cp_flag
    type: string
    description: "Call-plan inclusion flag; numeric-code meaning UNCONFIRMED (set aside 2026-06-26)."
    sample_values: [Y, N]
  - name: ai6_cp_flag
    type: string
    description: "Call-plan inclusion flag; numeric-code meaning UNCONFIRMED (set aside 2026-06-26)."
    sample_values: [Y, N]
  - name: ai45_cp_flag
    type: string
    description: "Call-plan inclusion flag; numeric-code meaning UNCONFIRMED (set aside 2026-06-26)."
    sample_values: [Y, N]
  - name: ai456_cp_flag
    type: string
    description: "Call-plan inclusion flag. CONSTANT 'N' across the entire extract (dead column); numeric-code meaning UNCONFIRMED (set aside 2026-06-26)."
    sample_values: [N]
  - name: ai10_cp_flag
    type: string
    description: "Call-plan inclusion flag; numeric-code meaning UNCONFIRMED (set aside 2026-06-26)."
    sample_values: [Y, N]
  - name: all_cp_flag
    type: string
    description: "Call-plan inclusion flag (broadest call plan); numeric-code meaning UNCONFIRMED (set aside 2026-06-26)."
    sample_values: [Y, N]
  - name: pdrp_flag
    type: string
    description: "PDRP = Prescriber Data Restriction Program. Y = HCP opted out of having individual prescribing data shared. Per user decision (2026-06-26) NO suppression rule is applied; flag is documented only."
    sample_values: [Y, N]
  - name: abv_best_specialty_code
    type: string
    description: "AbbVie best-specialty code."
    sample_values: [GE, PG, NRP, PHA, IM]
  - name: specialty_description
    type: string
    description: "Specialty label; predominantly Gastroenterology."
    sample_values: [Gastroenterology, Pediatric Gastroenterology, Nurse Practitioner, Physician Assistant, Internal Medicine]
  - name: bio_decile
    type: integer
    description: "Biologics-writing decile, 0-10 (10 = top decile of biologic IBD prescribing; 0 = no measured biologic volume)."
  - name: bio_decile_group
    type: string
    description: "Banded bio_decile: LOW=0-2, MEDIUM=3-6, HIGH=7-10 (RULE-008)."
    sample_values: [LOW, MEDIUM, HIGH]
  - name: hum_decile
    type: integer
    description: "Humira-writing decile, 0-10."
  - name: hum_decile_group
    type: string
    description: "Banded hum_decile: LOW=0-2, MEDIUM=3-6, HIGH=7-10 (RULE-008)."
    sample_values: [LOW, MEDIUM, HIGH]
  - name: gastro_segments
    type: string
    description: "Behavioural HCP segment (RULE-302)."
    sample_values: [Influencers, Pragmatists, Fast Followers, Traditionalists, Unsegmented]
  - name: rinvoq_hits
    type: string
    description: "Y if the HCP is flagged as a Rinvoq promotional/engagement target ('hit'); N otherwise."
    sample_values: [Y, N]
  - name: skyrizi_hits
    type: string
    description: "Y if the HCP is flagged as a Skyrizi promotional/engagement target ('hit')."
    sample_values: [Y, N]
  - name: gastro_hits
    type: string
    description: "Y if the HCP is flagged as a gastro promotional/engagement target ('hit')."
    sample_values: [Y, N]
  - name: version_flag
    type: string
    description: "Data extract/snapshot version, single-valued (2026-06-05); identifies the masterdata cut."
    sample_values: [2026-06-05]
  - name: product_brand
    type: string
    description: "Brand, biosimilar, presentation, or CLASS-ROLLUP label. Class rollups {SI_ORAL, TNF, JAK, IL_23, IL_23_IL_12, A4B7, S1P} are sums over constituent brands — exclude from brand-level sums (RULE-101). SKYRIZI = SKYRIZI OBI; *_IV/_SQ/_CDV are presentation variants (RULE-303)."
    sample_values: [HUMIRA, SKYRIZI, RINVOQ, STELARA, TNF]
  - name: indication_code
    type: string
    description: "IBD indication: CD = Crohn's Disease, UC = Ulcerative Colitis. This table is IBD-only."
    sample_values: [CD, UC]
  - name: data_type
    type: string
    description: "Whether this row's frx* series holds Total Rx (TRx) or New-to-Brand Rx (NBRx). Selected by filter, not computed (RULE-005)."
    sample_values: [TRx, NBRx]
  - name: cur_4wk
    type: float
    description: "Current trailing-4-weeks sum of the frx* series: cur_4wk = sum(frx1..frx4), i.e. the most recent 4 weeks ending 2026-06-05 (RULE-007)."
  - name: pre_4wk
    type: float
    description: "Prior trailing-4-weeks sum: pre_4wk = sum(frx5..frx8), the 4 weeks immediately before the current window (RULE-007)."
  - name: cur_13wk
    type: float
    description: "Current trailing-13-weeks sum of the frx* series: cur_13wk = sum(frx1..frx13), i.e. the most recent 13 weeks ending 2026-06-05 (RULE-007)."
  - name: pre_13wk
    type: float
    description: "Prior trailing-13-weeks sum: pre_13wk = sum(frx14..frx26), the 13 weeks immediately before the current window (RULE-007)."
  - name: cur_26wk
