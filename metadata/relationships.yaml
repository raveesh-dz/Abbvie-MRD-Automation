- left: Weekly_Data_Tabular.PRODUCT + month(Weekly_Data_Tabular.WEEK_ENDING)
  right: Monthly_Data_Tabular.PRODUCT + Monthly_Data_Tabular.MONTH_DATE
  type: many-to-one
  notes: 'Allocation edge ONLY — not a row-level value join. Many weeks map to one
    month. Used by metrics RULE-004 to borrow the Monthly indication MIX (a ratio)
    and apply it to the Weekly total. The Monthly side must first be rolled up to
    the Weekly brand label per RULE-003 (crosswalk), and restricted to ROW_TYPE =
    PRODUCT over the mutually-exclusive indication set (PsA Derm + PsA Rheum, excluding
    Total PsA). Do NOT sum or compare TRX_ADJUSTED against TRX_VOLUME directly — they
    are different metrics; only the unitless mix crosses the edge. Weeks past max(MONTH_DATE)
    carry forward the latest split.

    '
