# The ONLY source of truth for joins. The engine will never join two tables
# unless an edge is declared here. No edge = the join is refused, not guessed.
#
# type: one-to-one | many-to-one | one-to-many
# notes: join direction (inner/left), null behavior, grain mismatches.
relationships:
  - left: Weekly_Data_Tabular.PRODUCT + month(Weekly_Data_Tabular.WEEK_ENDING)
    right: Monthly_Data_Tabular.PRODUCT + Monthly_Data_Tabular.MONTH_DATE
    type: many-to-one
    notes: >
      Allocation edge ONLY — not a row-level value join. Many weeks map to one
      month. Used by metrics RULE-004 to borrow the Monthly indication MIX (a
      ratio) and apply it to the Weekly total. The Monthly side must first be
      rolled up to the Weekly brand label per RULE-003 (crosswalk), and restricted
      to ROW_TYPE = PRODUCT over the mutually-exclusive indication set (PsA Derm +
      PsA Rheum, excluding Total PsA). Do NOT sum or compare TRX_ADJUSTED against
      TRX_VOLUME directly — they are different metrics; only the unitless mix
      crosses the edge. Weeks past max(MONTH_DATE) carry forward the latest split.

# The two tables share no other validated linkage. They are independent IQVIA
# e-laad extracts at different grains (week vs month), different metrics
# (TRX_ADJUSTED vs TRX_VOLUME), and different product granularity. PRODUCT is NOT
# a clean row-join key — outside RULE-003 the labels diverge by case and dose/form.
# Any join beyond the allocation edge above is a data gap: surface it, don't guess.
#
# Gastro_prod_sales_260605 (the gastro HCP universe table)
# uses class-coded product labels (TNF, JAK, IL_23, ...) plus brand/biosimilar labels
# that do NOT align with the Weekly/Monthly PRODUCT vocabulary, and it carries its own
# positional weekly frx* series — so it has NO edge to the Weekly/Monthly tables. Its
# internal slice self-alignment of (product_brand, indication_code, data_type) on
# abv_customer_id (1:1, RULE-005) is within-table, not a cross-table edge.
#
# It DOES join, on the HCP key, to the two HCP reference tables below. The HCP key is
# the same value space across all three: gastro abv_customer_id == HCP_demographics
# .abbott_customer_id == Holdout_HCP_Universe.abbott_customer_id (join-compatible; the
# holdout now covers 700 of the universe's 1,040 ids — a strict subset, not full).
# HCP_demographics MUST be deduped to one row per HCP (RULE-009) before
# any of its edges are used, or the join fans out (raw demo is up to 3 rows/HCP).

  - left: HCP_demographics.abbott_customer_id
    right: Gastro_prod_sales_260605.abv_customer_id
    type: one-to-one
    notes: >
      HCP demographics enrichment. Dedupe HCP_demographics to one row/HCP per RULE-009
      FIRST (raw is up to 3 rows/HCP → otherwise many-to-one fan-out). Left join from
      the gastro universe; 5 HCPs have no geo and will be null. HCP_demographics is the
      authoritative geography source (RULE-305): its zip/state override the universe's.

  - left: Holdout_HCP_Universe.abbott_customer_id
    right: Gastro_prod_sales_260605.abv_customer_id
    type: one-to-one
    notes: >
      The holdout is a strict subset (700 of the 1,040 universe ids), so this RESTRICTS
      gastro HCP analyses to in-scope HCPs (RULE-102) — material, not a no-op. The edge
      is 1:1 on matched ids; it simply no longer covers the whole universe.

  - left: HCP_demographics.abbott_customer_id
    right: Holdout_HCP_Universe.abbott_customer_id
    type: one-to-one
    notes: >
      Direct edge between the two HCP reference tables (e.g. demographics of the holdout
      universe without going through the gastro fact table). Dedupe HCP_demographics per
      RULE-009 first.
