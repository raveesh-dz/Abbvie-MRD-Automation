# The ONLY source of truth for joins. The engine will never join two tables
# unless an edge is declared here. No edge = the join is refused, not guessed.
#
# type: one-to-one | many-to-one | one-to-many
# notes: join direction (inner/left), null behavior, grain mismatches.
relationships:
  - left: Weekly_Data_Tabular.PRODUCT + month(Weekly_Data_Tabular.WEEK_ENDING)
    right: Monthly_Data_Tabular.PRODUCT + Monthly_Data_Tabular.MONTH_DATE
    type: many-to-one
    notes: >
      Allocation edge ONLY — not a row-level value join. Many weeks map to one
      month. Used by metrics RULE-004 to borrow the Monthly indication MIX (a
      ratio) and apply it to the Weekly total. The Monthly side must first be
      rolled up to the Weekly brand label per RULE-003 (crosswalk), and restricted
      to ROW_TYPE = PRODUCT over the mutually-exclusive indication set (PsA Derm +
      PsA Rheum, excluding Total PsA). Do NOT sum or compare TRX_ADJUSTED against
      TRX_VOLUME directly — they are different metrics; only the unitless mix
      crosses the edge. Weeks past max(MONTH_DATE) carry forward the latest split.

# The two tables share no other validated linkage. They are independent IQVIA
# e-laad extracts at different grains (week vs month), different metrics
# (TRX_ADJUSTED vs TRX_VOLUME), and different product granularity. PRODUCT is NOT
# a clean row-join key — outside RULE-003 the labels diverge by case and dose/form.
# Any join beyond the allocation edge above is a data gap: surface it, don't guess.
#
# sqlqueries_4_gastro_hcp_universe_prod_2_260605_cl (the gastro HCP universe table)
# is STANDALONE — no validated edge to either table above. It is HCP-grain and uses
# class-coded product labels (TNF, JAK, IL_23, ...) plus brand/biosimilar labels that
# do NOT align with the Weekly/Monthly PRODUCT vocabulary, and it carries its own
# positional weekly frx* series (different time encoding). Its only INTERNAL "join"
# is self-alignment of (product_brand, indication_code, data_type) slices on
# abv_customer_id (1:1, RULE-005) — that is within-table, not a cross-table edge.
# Any cross-table join to it is a data gap: surface it, don't guess.
