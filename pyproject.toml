[project]
name = "mrd-engine"
version = "0.1.0"
description = "MRD data layer: connectors, metadata, joins, foundation for the Query-to-Slide engine."
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=15",
  "pyyaml>=6",
  "snowflake-connector-python[pandas]>=3.6",
  "typer>=0.12",
  "rich>=13",
]

[project.scripts]
mrd = "mrd_engine.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
